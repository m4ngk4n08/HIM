services:
  him-ai:
    image: ghcr.io/m4ngk4n08/him-ai:latest
    restart: always
    environment:
      - AiSettings__ChatProvider=Gemini
      - AiSettings__Security__SharedSecret=${AI_SHARED_SECRET}
      - AiSettings__Groq__ApiKey=${GROQ_API_KEY}
      - AiSettings__Groq__ModelId=llama-3.3-70b-versatile
      - AiSettings__Groq__Endpoint=https://api.groq.com/openai/v1
      - AiSettings__Gemini__ApiKey=${GEMINI_API_KEY}
      - AiSettings__Gemini__ModelId=gemini-3.1-flash-lite
      - AiSettings__Onnx__Tokenizer=Models/AllMiniLML6V2/vocab.txt
      - AiSettings__Onnx__Model=Models/AllMiniLML6V2/model.onnx
      - AiSettings__KnowledgeBase__FilePath=knowledge-base.json
      - AiSettings__KnowledgeBase__CacheFile=cache/knowledge-base.embeddings.bin
      - AiSettings__KnowledgeBase__MemoryCollectionName=angelo-kb
      - LOG_PATH=/app/Logs/ai-log-.json
    ports:
      - "127.0.0.1:8080:8080"   # internal only
    volumes:
      - ./cache:/app/cache
      - /var/log/him:/app/Logs   # <--- host directory mount

  him-gateway:
    image: ghcr.io/m4ngk4n08/him-gateway:latest
    ports:
      - "22:22"
    environment:
      - SshSettings__Port=22
      - AiServiceSettings__BaseUrl=http://him-ai:8080
      - AiServiceSettings__SharedSecret=${AI_SHARED_SECRET}
      - TERM=xterm-256color
      - DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION=true
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      # ----- Logging (new) -----
      - LOG_PATH=/app/Logs/gateway-log-.json
      - GameSettings__ScoresPath=/app/data/game-scores.json
    volumes:
      - ./keys/hostkey.pem:/app/hostkey.pem
      - /var/log/him:/app/Logs   # <--- same host directory
      - ./data:/app/data   # game leaderboard; host dir must be owned by UID 1654
    depends_on:
      - him-ai
    restart: always